<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Descargar documentos DIAN</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; width: 360px; padding: 15px; margin: 0; background-color: #f8f9fa; }
    h2 { font-size: 16px; margin-top: 0; color: #0056b3; }
    .form-group { margin-bottom: 12px; }
    label { font-size: 12px; font-weight: bold; display: block; margin-bottom: 4px; }
    input[type="text"], textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
    textarea { height: 90px; resize: vertical; }
    button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #6c757d; cursor: not-allowed; }
    .folder-row { display: flex; gap: 6px; align-items: stretch; }
    .folder-box { flex: 1; background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 7px 8px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .folder-box.warn { border-color: #dc3545; color: #dc3545; }
    #btnFolder { width: auto; padding: 6px 10px; font-size: 11px; background-color: #198754; }
    .actions { display: flex; gap: 6px; }
    #btnStop { background-color: #dc3545; width: 35%; }
    #btnStop:disabled { background-color: #adb5bd; }
    .report { background-color: #198754; margin-top: 6px; padding: 7px; font-size: 12px; }
    #msg { font-size: 11px; color: #dc3545; min-height: 14px; margin: 6px 0 0; }
    .hint { font-size: 10px; color: #666; margin-top: 3px; }
    #btnClearLogs { background-color: #6c757d; padding: 4px 8px; font-size: 10px; float: right; width: auto; }
    #logs { margin-top: 10px; height: 130px; background: #1e1e1e; color: #00ff66; padding: 8px; font-family: monospace; font-size: 10px; overflow-y: auto; border-radius: 4px; clear: both; }
    .log-entry { margin-bottom: 4px; word-break: break-all; }
  </style>
</head>
<body>
  <h2>Descargar documentos DIAN</h2>

  <div class="form-group">
    <label for="nit">NIT Emisor/Receptor (también es la contraseña del PDF):</label>
    <input type="text" id="nit" placeholder="Ej: 900665391">
  </div>

  <div class="form-group">
    <label>Carpeta de destino:</label>
    <div class="folder-row">
      <div id="folderBox" class="folder-box">(ninguna)</div>
      <button id="btnFolder">Seleccionar carpeta</button>
    </div>
  </div>

  <div class="form-group">
    <label for="cufes">Lista de CUFEs (uno por línea):</label>
    <textarea id="cufes" placeholder="Pegue aquí los CUFEs..."></textarea>
    <div class="hint" id="cufeCount"></div>
  </div>

  <div class="actions">
    <button id="btnStart">Iniciar Descargas</button>
    <button id="btnStop" disabled>Detener</button>
  </div>
  <div id="msg"></div>
  <button id="btnReport" class="report">📊 Generar Excel de la última descarga</button>

  <div style="margin-top: 8px;">
    <span style="font-size: 12px; font-weight: bold;">Consola de Logs:</span>
    <button id="btnClearLogs">Limpiar</button>
  </div>
  <div id="logs"></div>

  <script src="lib/idb.js"></script>
  <script src="popup.js"></script>
</body>
</html>
